<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="AgentTrace — AI agent observer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0c4a6e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="loop" d="M0 0 m-150 0 a150 150 0 1 0 300 0 a150 150 0 1 0 -300 0" fill="none" stroke="none"/>
  </defs>

  <!-- background -->
  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>
  <path d="M0 385 Q 300 340 600 385 T 1200 385" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>

  <!-- left: text -->
  <g font-family="sans-serif">
    <text x="60" y="120" fill="#e2e8f0" font-size="34" font-weight="700">Agent<span fill="url(#cyber)">Trace</span></text>
    <text x="60" y="158" fill="#94a3b8" font-size="16">An AI-agent observer</text>
    <text x="60" y="186" fill="#cbd5e1" font-size="13">decide &#183; execute tool &#183; log trajectory &#183; score</text>
    <text x="60" y="210" fill="#64748b" font-size="12">Python runtime + Flask API + Next.js observer UI</text>
    <line x1="60" y1="228" x2="330" y2="228" stroke="url(#cyber)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- center: agent loop -->
  <g transform="translate(650 200)">
    <!-- dashed orbit ring -->
    <circle r="150" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite"/>
    </circle>

    <!-- orbiting tool nodes: web_search, supabase, gmail -->
    <circle r="20" fill="#1e293b" stroke="#22d3ee" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite">
        <mpath href="#loop"/>
      </animateMotion>
    </circle>
    <text font-family="sans-serif" font-size="10" fill="#22d3ee" text-anchor="middle" dy="-2">
      <textPath href="#loop" startOffset="0%">&#127760;</textPath>
    </text>
    <text font-family="monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">
      <textPath href="#loop" startOffset="0%">search</textPath>
    </text>

    <circle r="20" fill="#1e293b" stroke="#a855f7" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-4s">
        <mpath href="#loop"/>
      </animateMotion>
    </circle>
    <text font-family="monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">
      <textPath href="#loop" startOffset="33.3%">store</textPath>
    </text>

    <circle r="20" fill="#1e293b" stroke="#f472b6" stroke-width="2">
      <animateMotion dur="12s" repeatCount="indefinite" begin="-8s">
        <mpath href="#loop"/>
      </animateMotion>
    </circle>
    <text font-family="monospace" font-size="9" fill="#e2e8f0" text-anchor="middle">
      <textPath href="#loop" startOffset="66.6%">email</textPath>
    </text>

    <!-- radar pulse rings -->
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="40;150" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="40;150" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle r="40" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="40;150" dur="3s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite" begin="2s"/>
    </circle>

    <!-- agent head -->
    <rect x="-34" y="-78" width="68" height="56" rx="12" fill="url(#core)" stroke="#38bdf8" stroke-width="2"/>
    <rect x="-24" y="-64" width="14" height="12" rx="4" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="10" y="-64" width="14" height="12" rx="4" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.6s" repeatCount="indefinite" begin="0.4s"/>
    </rect>
    <rect x="-12" y="-46" width="24" height="5" rx="2.5" fill="#e2e8f0"/>
    <!-- antenna -->
    <line x1="0" y1="-78" x2="0" y2="-100" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-104" r="4" fill="#fbbf24" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite"/>
    </circle>
    <!-- neck + body -->
    <rect x="-8" y="-22" width="16" height="8" fill="#475569"/>
    <rect x="-30" y="-14" width="60" height="40" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <!-- chest: ticking score -->
    <text x="0" y="6" font-family="monospace" font-size="14" font-weight="700" fill="#4ade80" text-anchor="middle">100</text>
    <text x="0" y="18" font-family="sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">golden path</text>
    <!-- body circuit strip -->
    <g stroke="#22d3ee" stroke-width="1.5" fill="none" opacity="0.8">
      <path d="M-22 24 H22"/>
      <path d="M-14 30 H14"/>
    </g>
    <!-- arms -->
    <line x1="-30" y1="-8" x2="-48" y2="12" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <circle cx="-50" cy="14" r="5" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="1.3s" repeatCount="indefinite"/>
    </circle>
    <line x1="30" y1="-8" x2="48" y2="12" stroke="#475569" stroke-width="5" stroke-linecap="round"/>
    <circle cx="50" cy="14" r="5" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="r" values="4;6;4" dur="1.3s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
  </g>

  <!-- right: trajectory stream -->
  <g transform="translate(1000 90)">
    <rect x="0" y="0" width="130" height="220" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="12" y="24" font-family="monospace" font-size="11" fill="#22d3ee">trajectory</text>
    <line x1="12" y1="34" x2="118" y2="34" stroke="#334155" stroke-width="1"/>
    <!-- streaming step rows -->
    <g font-family="monospace" font-size="9">
      <text x="12" y="54" fill="#4ade80">&#10003; web_search</text>
      <text x="12" y="70" fill="#4ade80">&#10003; supabase_insert</text>
      <text x="12" y="86" fill="#4ade80">&#10003; gmail_send</text>
      <text x="12" y="106" fill="#64748b">&#9654; scoring…</text>
    </g>
    <!-- blinking cursor -->
    <rect x="12" y="120" width="6" height="10" fill="#22d3ee" opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
    <!-- flowing sparkline -->
    <polyline fill="none" stroke="#a855f7" stroke-width="2" points="12,190 30,175 48,182 66,160 84,168 102,145 118,152">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </polyline>
    <text x="12" y="210" font-family="sans-serif" font-size="9" fill="#94a3b8">score 100 &#183; CI green</text>
  </g>
</svg>